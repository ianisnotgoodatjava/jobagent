[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "A job search run from Gmail: applications into a sheet, and researched outreach left as unsent Gmail drafts."
readme = "README.md"
# scikit-learn 1.9 needs 3.12.
requires-python = ">=3.12"
# The same list as requirements.txt, which a checkout's venv installs from;
# tests/test_packaging.py fails if the two drift apart.
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.60.0",
    "anthropic>=1.0.0",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pyflakes>=3.0"]

[project.scripts]
jobagent = "jobagent.console.main:main"

[tool.setuptools.packages.find]
include = ["jobagent*"]
